<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta name="author" content="{{ site.name }}">
<meta property="og:title" content="{{ site.name }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:type" content="website">
<link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/style.css">
<script>
  (function(){var t;try{t=localStorage.getItem('theme');}catch(e){}
   if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
   document.documentElement.setAttribute('data-theme',t);
   document.documentElement.classList.add('js');})();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="mark" src="static/img/favicon.svg" alt="" width="20" height="20">
      <span>{{ site.name }}</span>
    </a>
    <div class="nav-wrap">
      <nav class="nav" id="site-nav" aria-label="Main">
        {% for item in site.nav %}
        <a href="{{ item.href }}"{% if item.href == current_page %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </nav>
      <button class="theme-toggle" aria-label="Switch theme" title="Toggle light/dark">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    </div>
  </div>
</header>

<main id="main">
{% block content %}{% endblock %}
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>© <span id="year">{{ site.year }}</span> {{ site.name }}</p>
    <div class="foot-links">
      {% for item in site.nav %}
      {% if item.href != current_page %}<a href="{{ item.href }}">{{ item.label }}</a>{% endif %}
      {% endfor %}
    </div>
  </div>
</footer>

<script src="static/js/main.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
