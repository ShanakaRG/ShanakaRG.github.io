name: Build site

# Rebuilds docs/ whenever you change anything in content/, templates/ or
# static/ — so you can edit a YAML file straight in the GitHub web editor and
# the published site updates on its own. You never have to run build.py
# yourself unless you want to preview locally.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'static/**'
      - 'build.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Commit the rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site"
            git push
          fi
