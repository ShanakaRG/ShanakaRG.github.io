- slug: cnn
  title: Modifying CNN architectures for better performance
  short: Modified CNN architecture
  when: "2020"
  kind: graduate research
  objective: >-
    Convolutional neural networks remain expensive to train, and the cost grows
    sharply with network size. This project asks whether the existing
    architecture can be modified to improve the trade-off between computational
    cost and accuracy.
  approach: >-
    Training deep networks has traditionally been difficult because vanishing
    gradients leave layers near the input effectively unchanged by errors
    computed on the training set. We are developing a cascaded layer-wise
    training architecture intended to reduce computational cost and mitigate the
    vanishing gradient problem. The work is at an early stage — literature
    review and testing of a small number of models.
  collaborators:
    - Prof. Mahesan Niranjan — University of Southampton, UK
    - Dr. Maheshi B. Dissanayake — University of Peradeniya

- slug: manipulator
  title: Controller design for a robot manipulator
  short: Robot manipulator controller
  when: 2019 – 2020
  kind: graduate research
  objective: >-
    Build a complete mathematical model of a 5-DOF robot manipulator using
    forward and inverse kinematics, then implement a decoupling control system
    to improve smoothness and efficiency.
  approach: >-
    The PUMA 560 is a commercially available 6-DOF manipulator. Reverse
    engineering was used to derive a full forward and inverse kinematic model.
    Individual joint controllers were then implemented for all five joints,
    followed by a decoupling control system. The model was tested successfully in
    MATLAB Simulink using SimMechanics. The project was sponsored by GPV Lanka
    (Pvt) Ltd.
  collaborators:
    - Prof. Lilantha Samaranayake
    - Dr. Nalin Harischandra
