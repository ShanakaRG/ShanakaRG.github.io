- slug: elephant
  title: Elephant–train collision prevention system
  short: Elephant–train collision prevention
  when: 2020 – ongoing
  kind: graduate research
  objective: >-
    Develop a sensor unit and associated algorithms that detect elephants on or
    near a train track at a distance sufficient for the driver to react. The unit
    combines a Jetson Xavier computing platform, a laser range finder, a
    wide-angle camera, an infrared camera and a 3G/4G modem, powered by a
    solar-charged lithium-ion battery pack.
  approach: >-
    A Reolink infrared night-detection camera module was selected as the sensor
    unit and a YOLOv3 Darknet model used for detection. A custom dataset was
    collected and transfer learning applied on top of YOLOv3 weights. When an
    elephant is detected on the track, an alert is transmitted to the train
    driver and to nearby railway stations.
  funding: >-
    IEEE Special Interest Group on Humanitarian Technology (SIGHT), Robotics and
    Automation Society (RAS), USA · [NVIDIA Applied Research Accelerator
    Program](https://www.nvidia.com/en-us/industries/higher-education-research/applied-research-program/).
  collaborators:
    - Prof. Lilantha Samaranayake — University of Peradeniya
    - Prof. Kithsiri M. Liyanage — University of Peradeniya
    - Dr. Nalin Harischandra — University of Peradeniya
    - Dr. Tharindu Weerakoon — University of Peradeniya
    - Dr. Parakrama Ekanayake — University of Peradeniya
    - Prof. Gamini Dissanayake — University of Technology Sydney
    - Dr. Ravindra Ranasinghe — University of Technology Sydney
    - Mr. Maleen Jayasuriya — University of Technology Sydney
