- slug: mppt
  title: Maximum power point tracking device
  short: Maximum power point tracker
  when: "2017"
  kind: third-year mini research project
  objective: >-
    Develop an algorithm based on the perturb and observe method to maximise
    photovoltaic array output power.
  approach: |-
    Tracking the maximum power point of a PV array is difficult because its I–V characteristic is nonlinear and depends on temperature and irradiation. With the standard perturb and observe method, the operating point converges towards the optimum but then oscillates around it rather than settling. The proposed method applies adaptive delta modulation to reduce that oscillation, and uses the PV array output to control the DC/DC converter directly, reducing system complexity.

    Panel voltage, panel current, output power and battery voltage were transmitted to the main board over UART. A custom protocol was developed for this link: each byte carries a tag in the high nibble and a data value in the low nibble.
  outcome: >-
    Published at the IET Present Around the World technical conference 2018,
    University of Moratuwa, where it took third place in the best paper presenter
    category.
  collaborators:
    - N. M. S. Silva
    - W. A. L. H. Wickramanayake
  # files:
  #   - label: Report (PDF)
  #     file: files/papers/maximum-power-point-tracking.pdf
  links:
    - label: Paper
      href: https://www.researchgate.net/publication/347524486_Maximum_Power_Point_Tracking_Device

- slug: guitar
  title: Ghost Guitar
  when: "2017"
  kind: Access Hackathon
  objective: >-
    Design a device that plugs into any guitar and lets it be played with one
    hand.
  approach: >-
    Built for people who have use of a single hand and still want to play. The
    device produces any strumming pattern from user input, leaving the player to
    change chords with their one free hand.
  collaborators:
    - N. M. S. Silva
    - R. T. Munasinghe
